name: LainaWiki
version: 0.2.0
main: pl.laina.reforge.wiki.LainaWikiPlugin
api-version: '26.2'
author: slawek2131
description: Dialogowa Ksiega Lainy dla serwera Laina.pl

commands:
  wiki:
    description: Otwiera Ksiegę Lainy
    usage: /wiki [nazwa|reka]
    aliases: [ksiega, wikici]
    permission: lainawiki.use

permissions:
  lainawiki.use:
    description: Pozwala korzystac z Ksiegi Lainy
    default: true
